name: Refresh terminal data

on:
  schedule:
    # a cada 15 min, dias de semana (UTC) -- cobre pre-market/mercado/after-hours
    - cron: "*/15 * * * 1-5"
    # a cada hora ao fim de semana (so BTC/Deribit tem dados relevantes)
    - cron: "0 * * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminal-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt --ignore-installed PyJWT -q

      - name: Export terminal data
        run: python backtest/quant/export_terminal_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/public/data
          if git diff --cached --quiet; then
            echo "Sem alteracoes nos dados, nada a comitar."
            exit 0
          fi
          git commit -m "chore: refresh terminal data [skip ci]"
          git push
