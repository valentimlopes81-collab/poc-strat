name: Refresh terminal data

on:
  schedule:
    # a cada 15 min, dias de semana (UTC) -- cobre pre-market/mercado/after-hours
    - cron: "*/15 * * * 1-5"
    # a cada hora ao fim de semana (so BTC/Deribit tem dados relevantes)
    - cron: "0 * * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminal-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # so os pacotes que o export_terminal_data.py precisa -- nao usamos
        # -r requirements.txt porque esse ficheiro tambem fixa fastapi/uvicorn
        # de outra parte do repo, com versoes que entram em conflito com as
        # dependencias do openbb-core num ambiente CI limpo.
        run: |
          python -m pip install -q \
            openbb-core==2.0.1 openbb-cboe==2.0.0 openbb-cftc==2.0.0 \
            openbb-federal-reserve==2.0.0 openbb-derivatives==2.0.0 \
            openbb-equity==2.0.0 pandas

      - name: Export terminal data
        run: python backtest/quant/export_terminal_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/public/data
          if git diff --cached --quiet; then
            echo "Sem alteracoes nos dados, nada a comitar."
            exit 0
          fi
          git commit -m "chore: refresh terminal data [skip ci]"
          git push
