name: Refresh terminal data

on:
  schedule:
    # O site calcula tudo ao vivo (terminal/api); este job so guarda o snapshot
    # de recurso e acrescenta ao historico. De 15 em 15 min nos dias de semana,
    # fora dos minutos redondos: o GitHub atrasa/descarta agendamentos em :00,
    # :15, :30 e :45, que e quando toda a gente agenda.
    - cron: "7,22,37,52 * * * 1-5"
    # a cada hora ao fim de semana (so BTC/Deribit tem dados relevantes)
    - cron: "17 * * * 0,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: terminal-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # so os pacotes que o export_terminal_data.py precisa -- nao usamos
        # -r requirements.txt porque esse ficheiro tambem fixa fastapi/uvicorn
        # de outra parte do repo, com versoes que entram em conflito com as
        # dependencias do openbb-core num ambiente CI limpo.
        run: |
          python -m pip install -q \
            openbb-core==2.0.1 openbb-cboe==2.0.0 openbb-cftc==2.0.0 \
            openbb-federal-reserve==2.0.0 openbb-derivatives==2.0.0 \
            openbb-equity==2.0.0 pandas

      - name: Export terminal data
        run: python backtest/quant/export_terminal_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Snapshot the live API output (fallback for when the API is unreachable)
        working-directory: terminal
        # no npm install: the API functions have no dependencies
        run: node scripts/snapshot.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal/public/data
          if git diff --cached --quiet; then
            echo "Sem alteracoes nos dados, nada a comitar."
            exit 0
          fi
          git commit -m "chore: refresh terminal data [skip ci]"
          git push
