# Proxy reverso para o poc-strat. Ajusta server_name para o teu domínio.
# Depois corre `certbot --nginx -d TEU_DOMINIO` para ativar HTTPS (obrigatório:
# o TradingView só envia webhooks para portas 443/80).
server {
    listen 80;
    server_name TEU_DOMINIO;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
